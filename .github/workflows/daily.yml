name: 喵仔仔 AI 日报

on:
  schedule:
    # 兜底用。准时由外部触发器（cron-job.org 每天 10:00 调 workflow_dispatch）负责。
    # GitHub schedule 整点高峰会排队延迟数小时，故这里只作 fallback：
    # 03:11 UTC = 北京时间 11:11，错开整点、晚于外部触发；若外部已跑成功，
    # main.py 的幂等会跳过，不会重复发邮件。
    - cron: "11 3 * * *"
  workflow_dispatch:        # 外部触发器 / 手动触发都走这里
    inputs:
      force:
        description: "强制重跑（忽略当天幂等跳过），用于手动补发"
        type: boolean
        default: false

permissions:
  contents: write   # 用于把生成的 HTML 提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Setup Node (for Claude Code CLI)
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate daily report
        env:
          # 关键：CI 无本地登录态，靠此 token 让 claude -p 复用订阅额度。
          # 本地执行 `claude setup-token` 生成，存到仓库 Secrets。
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 备选：按量计费。二选一。
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 邮件推送（配齐这 5 个 Secret 才会发，否则自动跳过）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # GitHub Pages 公开网址，邮件大按钮指向这里
          PAGES_URL: https://mengzheng001-prog.github.io/miao-ai-daily/
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m src.main --force
          else
            python -m src.main
          fi

      - name: Commit report back to repo
        run: |
          git config user.name  "miao-bot"
          git config user.email "miao-bot@users.noreply.github.com"
          git add reports/ index.html
          git diff --staged --quiet || git commit -m "日报：$(date -u +%Y-%m-%d)"
          git push

      # ---- 可选：发布到 GitHub Pages，用 URL 在任意设备查看 ----
      # 需在仓库 Settings → Pages 选择来源。可用 actions/upload-pages-artifact + deploy-pages。

      # ---- 可选：邮件推送 ----
      # 配置 SMTP_* secrets 后，在 src/main.py 的 TODO 处实现，或加一个 send-mail step。
