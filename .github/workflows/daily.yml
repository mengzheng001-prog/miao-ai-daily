name: 喵仔仔 AI 日报

on:
  schedule:
    # 02:00 UTC = 北京时间 10:00。GitHub cron 高峰可能延迟，对日报可接受。
    - cron: "0 2 * * *"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write   # 用于把生成的 HTML 提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Setup Node (for Claude Code CLI)
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate daily report
        env:
          # 关键：CI 无本地登录态，靠此 token 让 claude -p 复用订阅额度。
          # 本地执行 `claude setup-token` 生成，存到仓库 Secrets。
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 备选：按量计费。二选一。
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.main

      - name: Commit report back to repo
        run: |
          git config user.name  "miao-bot"
          git config user.email "miao-bot@users.noreply.github.com"
          git add reports/ index.html
          git diff --staged --quiet || git commit -m "日报：$(date -u +%Y-%m-%d)"
          git push

      # ---- 可选：发布到 GitHub Pages，用 URL 在任意设备查看 ----
      # 需在仓库 Settings → Pages 选择来源。可用 actions/upload-pages-artifact + deploy-pages。

      # ---- 可选：邮件推送 ----
      # 配置 SMTP_* secrets 后，在 src/main.py 的 TODO 处实现，或加一个 send-mail step。
